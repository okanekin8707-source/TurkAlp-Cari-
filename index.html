<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkalp Teknoloji - Ön Muhasebe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-10">

    <!-- Header -->
    <header class="bg-blue-800 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold"><i class="fa-solid fa-calculator mr-2"></i>Türkalp Teknoloji</h1>
            <span class="text-xs bg-blue-900 px-2.5 py-1 rounded">Ön Muhasebe</span>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-5">

        <!-- Yeni Müşteri Ekle -->
        <section class="bg-white p-4 rounded-xl shadow-sm border">
            <h2 class="text-sm font-bold text-gray-700 mb-3 border-b pb-2">Yeni Müşteri Ekle</h2>
            <form id="cariForm" onsubmit="event.preventDefault(); cariEkle();" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Müşteri Adı / Unvan</label>
                    <input type="text" id="unvan" required placeholder="Ahmet Yılmaz" class="w-full p-2 border rounded text-sm outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Telefon</label>
                        <input type="tel" id="telefon" placeholder="05XX..." class="w-full p-2 border rounded text-sm outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Açılış Bakiyesi (TL)</label>
                        <input type="number" step="0.01" id="bakiye" placeholder="0.00" class="w-full p-2 border rounded text-sm outline-none focus:border-blue-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded text-sm transition">
                    Müşteriyi Kaydet
                </button>
            </form>
        </section>

        <!-- Müşteri Listesi -->
        <section class="bg-white p-4 rounded-xl shadow-sm border">
            <div class="flex justify-between items-center mb-3 border-b pb-2">
                <h2 class="text-sm font-bold text-gray-700">Müşteri Listesi</h2>
                <span id="toplamCari" class="text-xs text-gray-500 font-semibold">Toplam: 0</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500">
                            <th class="p-2 border-b">Müşteri</th>
                            <th class="p-2 border-b">Telefon</th>
                            <th class="p-2 border-b">Bakiye</th>
                            <th class="p-2 border-b text-center">Sil</th>
                        </tr>
                    </thead>
                    <tbody id="cariListesi" class="divide-y">
                        <!-- Liste JS ile gelecek -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- MÜŞTERİ İŞLEM DETAY MODALI -->
    <div id="detayModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-4 space-y-4 shadow-xl">
            
            <div class="flex justify-between items-center border-b pb-2">
                <div>
                    <h3 id="modalUnvan" class="font-bold text-gray-800 text-base">Müşteri Adı</h3>
                    <p id="modalTelefon" class="text-xs text-gray-500"></p>
                </div>
                <button type="button" onclick="modalKapat()" class="text-gray-400 hover:text-gray-600 text-lg font-bold px-2">✕</button>
            </div>

            <!-- Bakiye Durumu -->
            <div class="bg-gray-50 p-3 rounded border text-center">
                <span class="text-xs text-gray-500 block font-medium">GÜNCEL BAKİYE</span>
                <span id="modalBakiye" class="text-xl font-black text-blue-600">0.00 TL</span>
            </div>

            <!-- Borç / Tahsilat Ekleme Alanı -->
            <div class="bg-blue-50 p-3 rounded border border-blue-100 space-y-2">
                <h4 class="text-xs font-bold text-blue-900">BORÇ / ÖDEME EKLE</h4>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-medium text-gray-600">İşlem Tipi</label>
                        <select id="islemTipi" class="w-full p-2 border rounded text-xs bg-white outline-none">
                            <option value="borc">Borç Yaz (+ Artır)</option>
                            <option value="alacak">Tahsilat / Ödeme (- Düş)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-gray-600">Tutar (TL)</label>
                        <input type="number" step="0.01" id="islemTutar" placeholder="0.00" class="w-full p-2 border rounded text-xs outline-none bg-white">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-600">Açıklama</label>
                    <input type="text" id="islemAciklama" placeholder="Örn: Servis bedeli" class="w-full p-2 border rounded text-xs outline-none bg-white">
                </div>
                <button type="button" id="btnIslemKaydet" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded text-xs shadow">
                    İşlemi Kaydet
                </button>
            </div>

            <!-- İşlem Geçmişi -->
            <div>
                <h4 class="text-xs font-bold text-gray-700 mb-2">Hesap Hareket Geçmişi</h4>
                <div class="max-h-40 overflow-y-auto border rounded">
                    <table class="w-full text-left text-[11px]">
                        <thead class="bg-gray-100 text-gray-600">
                            <tr>
                                <th class="p-1.5">Tarih</th>
                                <th class="p-1.5">Açıklama</th>
                                <th class="p-1.5">Tip</th>
                                <th class="p-1.5 text-right">Tutar</th>
                            </tr>
                        </thead>
                        <tbody id="hareketListesi" class="divide-y">
                            <!-- Hareketler JS ile gelecek -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

            carileriListele();
            
            // Butona tıklama dinleyicisini doğrudan bağlayarak sayfa yenilenmesini engelliyoruz
            document.getElementById('btnIslemKaydet').onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();
                islemKaydet();
            };
        });

            const data = localStorage.getItem(DB_KEY);
            return data ? JSON.parse(data) : [];
        }

        function verileriYaz(data) {
            localStorage.setItem(DB_KEY, JSON.stringify(data));
        }
