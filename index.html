<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TürkAlp Teknoloji - Müşteri Takip v17</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-24 select-none">

    <!-- ÜST HEADER -->
    <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-30 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-users text-xl"></i>
            <div>
                <h1 class="font-bold text-sm leading-tight">TürkAlp Teknoloji</h1>
                <span class="text-[10px] text-blue-200 font-bold bg-blue-800 px-1.5 py-0.5 rounded">Versiyon 17 (v17)</span>
            </div>
        </div>
        <button type="button" onclick="yedekIndir()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-2.5 py-1.5 rounded-lg border border-blue-500 transition" title="Yedek Al">
            <i class="fa-solid fa-download"></i>
        </button>
    </header>

    <main class="p-4 max-w-lg mx-auto space-y-4">

        <!-- YENİ MÜŞTERİ EKLEME KARTI -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-slate-700 text-sm flex items-center gap-1.5 border-b pb-2">
                <i class="fa-solid fa-user-plus text-blue-600"></i> Yeni Müşteri Ekle (v17)
            </h2>

            <form onsubmit="musteriEkle(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Müşteri / Firma Adı *</label>
                    <input type="text" id="inpAd" required placeholder="Örn: Ahmet Yılmaz" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-500 focus:bg-white transition">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Telefon</label>
                        <input type="tel" id="inpTel" placeholder="05XX..." class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Açılış Bakiyesi (₺)</label>
                        <input type="number" step="0.01" id="inpBakiye" placeholder="0.00" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-500 focus:bg-white transition">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-3 rounded-xl text-sm shadow-md transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> Müşteriyi Kaydet
                </button>
            </form>
        </div>

        <!-- ÖZET FİNANSAL KART -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-2 gap-3 text-xs">
            <div class="bg-rose-50 p-3 rounded-xl border border-rose-100">
                <span class="text-rose-600 font-bold block mb-1">Müşteri Borçları (Alacağın)</span>
                <span id="ozetAlacak" class="text-base font-extrabold text-rose-700">0.00 ₺</span>
            </div>
            <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100 text-right">
                <span class="text-emerald-600 font-bold block mb-1">Müşteri Alacakları (Borcun)</span>
                <span id="ozetBorc" class="text-base font-extrabold text-emerald-700">0.00 ₺</span>
            </div>
        </div>

        <!-- MÜŞTERİ LİSTESİ VE ARAMA -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-700 text-sm">
                    Müşteriler <span id="lblSayac" class="text-xs bg-slate-100 px-2 py-0.5 rounded-full text-slate-500 font-normal">(0)</span>
                </h3>
            </div>
            <div class="relative">
                <i class="fa-solid fa-search absolute left-3 top-3 text-slate-400 text-xs"></i>
                <input type="text" id="inpArama" oninput="listele()" placeholder="Müşteri ara..." class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs outline-none focus:border-blue-500 transition">
            </div>

            <div id="listeContainer" class="space-y-2 max-h-[400px] overflow-y-auto custom-scroll pr-1"></div>
        </div>

    </main>

    <!-- MÜŞTERİ DETAY VE İŞLEM MODALI -->
    <div id="detayModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl w-full max-w-md p-5 space-y-4 shadow-2xl max-h-[92vh] overflow-y-auto custom-scroll">
            
            <div class="flex justify-between items-start border-b pb-3">
                <div>
                    <h3 id="mdlAd" class="font-bold text-slate-900 text-base">Müşteri Adı</h3>
                    <p id="mdlTel" class="text-xs text-slate-400 font-medium mt-0.5">Telefon Yok</p>
                </div>
                <button type="button" onclick="modalKapat()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center font-bold">✕</button>
            </div>

            <div class="bg-slate-900 text-white p-4 rounded-2xl text-center space-y-1">
                <span class="text-[10px] uppercase text-slate-400 font-bold block">GÜNCEL BAKİYE</span>
                <span id="mdlBakiye" class="text-2xl font-extrabold">0.00 ₺</span>
                <span id="mdlDurum" class="text-xs font-semibold block">Dengede</span>
            </div>

            <!-- İşlem Ekleme Formu (Form submit garantili) -->
            <form onsubmit="islemKaydetForm(event)" class="bg-blue-50 p-3.5 rounded-2xl border border-blue-100 space-y-3">
                <input type="hidden" id="mdlMusteriId">
                <h4 class="text-xs font-bold text-blue-900 flex items-center gap-1.5">
                    <i class="fa-solid fa-file-invoice-dollar text-blue-600"></i> İŞLEM / MALZEME EKLE
                </h4>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-0.5">İşlem Türü</label>
                        <select id="islemTip" class="w-full p-2 bg-white border border-slate-300 rounded-xl text-xs outline-none font-medium">
                            <option value="verdim">Mal / Borç Verdim (+ Artırır)</option>
                            <option value="aldim">Para / Tahsilat Aldım (- Düşer)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Tutar (₺)</label>
                        <input type="number" step="0.01" id="islemTutar" required placeholder="0.00" class="w-full p-2 bg-white border border-slate-300 rounded-xl text-xs outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Açıklama / Ürün</label>
                    <input type="text" id="islemAciklama" placeholder="Örn: 5000 TL Tahsilat / Servis Bedeli" class="w-full p-2 bg-white border border-slate-300 rounded-xl text-xs outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check"></i> İşlemi Kaydet ve Hesapla
                </button>
            </form>

            <div>
                <h4 class="text-xs font-bold text-slate-700 mb-2">Hesap Geçmişi</h4>
                <div id="mdlHareketler" class="space-y-1.5 max-h-40 overflow-y-auto custom-scroll pr-1"></div>
            </div>

            <div class="border-t pt-3 flex justify-between items-center">
                <button type="button" onclick="duzenlePrompt()" class="text-slate-500 text-xs font-bold hover:text-blue-600">
                    <i class="fa-solid fa-pen-to-square mr-1"></i> Düzenle
                </button>
                <button type="button" onclick="musteriSil()" class="text-rose-600 text-xs font-bold hover:underline">
                    <i class="fa-solid fa-trash-can mr-1"></i> Müşteriyi Sil
                </button>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT KODU (v17) -->
    <script>
        const KEY = 'turkalp_sade_musteri_db_v17';

        window.onload = function() {
            listele();
        };

        function oku() {
            const raw = localStorage.getItem(KEY);
            if (!raw) return [];
            try { return JSON.parse(raw); } catch(e) { return []; }
        }

        function yaz(data) {
            localStorage.setItem(KEY, JSON.stringify(data));
        }

        function musteriEkle(e) {
            e.preventDefault();
            const ad = document.getElementById('inpAd').value.trim();
            const tel = document.getElementById('inpTel').value.trim();
            const bakiye = parseFloat(document.getElementById('inpBakiye').value) || 0;

            if (!ad) return;

            const db = oku();
            db.unshift({
                id: 'm_' + Date.now(),
                ad: ad,
                tel: tel,
                bakiye: bakiye,
                hareketler: bakiye !== 0 ? [{
                    tarih: new Date().toLocaleDateString('tr-TR') + ' ' + new Date().toLocaleTimeString('tr-TR', {hour:'2-2', minute:'2-2'}),
                    aciklama: 'Açılış Bakiyesi',
                    tip: bakiye > 0 ? 'verdim' : 'aldim',
                    tutar: Math.abs(bakiye)
                }] : []
            });

            yaz(db);
            document.getElementById('inpAd').value = '';
            document.getElementById('inpTel').value = '';
            document.getElementById('inpBakiye').value = '';
            listele();
        }

        function listele() {
            const db = oku();
            const arama = document.getElementById('inpArama').value.toLowerCase();
            const container = document.getElementById('listeContainer');
            container.innerHTML = '';

            let topAlacak = 0;
            let topBorc = 0;

            const filtrelenmis = db.filter(m => m.ad.toLowerCase().includes(arama));
            document.getElementById('lblSayac').textContent = `(${filtrelenmis.length})`;

            if (filtrelenmis.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-200">Kayıtlı müşteri bulunamadı.</div>`;
            }

            filtrelenmis.forEach(m => {
                const b = Number(m.bakiye) || 0;
                if (b > 0) topAlacak += b;
                if (b < 0) topBorc += Math.abs(b);

                let renk = b > 0 ? 'text-rose-600' : (b < 0 ? 'text-emerald-600' : 'text-slate-400');
                let durum = b > 0 ? 'Borçlu (Sana)' : (b < 0 ? 'Alacaklı (Senden)' : 'Dengede');

                const card = document.createElement('div');
                card.className = "bg-white p-3.5 rounded-xl border border-slate-200 flex justify-between items-center cursor-pointer hover:bg-blue-50/60 transition shadow-xs";
                card.onclick = function() { detayAç(m.id); };

                card.innerHTML = `
                    <div>
                        <h4 class="font-bold text-slate-800 text-sm">${m.ad}</h4>
                        <p class="text-xs text-slate-400"><i class="fa-solid fa-phone mr-1 text-[10px]"></i>${m.tel || 'Telefon yok'}</p>
                    </div>
                    <div class="text-right">
                        <span class="font-extrabold text-sm block ${renk}">${Math.abs(b).toFixed(2)} ₺</span>
                        <span class="text-[10px] font-bold ${renk}">${durum}</span>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('ozetAlacak').textContent = `${topAlacak.toFixed(2)} ₺`;
            document.getElementById('ozetBorc').textContent = `${topBorc.toFixed(2)} ₺`;
        }

        function detayAç(id) {
            const mId = String(id);
            document.getElementById('mdlMusteriId').value = mId;
            
            const db = oku();
            const m = db.find(x => String(x.id) === mId);
            if (!m) return;

            document.getElementById('mdlAd').textContent = m.ad;
            document.getElementById('mdlTel').textContent = m.tel ? 'Tel: ' + m.tel : 'Telefon yok';

            const b = Number(m.bakiye) || 0;
            const bEl = document.getElementById('mdlBakiye');
            const dEl = document.getElementById('mdlDurum');

            bEl.textContent = `${Math.abs(b).toFixed(2)} ₺`;
            if (b > 0) {
                dEl.textContent = 'Müşteri Size Borçludur';
                dEl.className = 'text-xs font-semibold text-rose-400 block';
            } else if (b < 0) {
                dEl.textContent = 'Müşteri Sizden Alacaklıdır';
                dEl.className = 'text-xs font-semibold text-emerald-400 block';
            } else {
                dEl.textContent = 'Hesap Dengededir (0.00 ₺)';
                dEl.className = 'text-xs font-semibold text-slate-400 block';
            }

            hareketCiz(m.hareketler || []);
            document.getElementById('detayModal').classList.remove('hidden');
        }

        function modalKapat() {
            document.getElementById('detayModal').classList.add('hidden');
            document.getElementById('mdlMusteriId').value = '';
        }

        function islemKaydetForm(e) {
            e.preventDefault();
            const targetId = document.getElementById('mdlMusteriId').value;
            
            if (!targetId) {
                alert('Müşteri ID bulunamadı.');
                return;
            }

            const tip = document.getElementById('islemTip').value;
            const tutarInput = document.getElementById('islemTutar');
            const tutar = parseFloat(tutarInput.value);
            const aciklamaInput = document.getElementById('islemAciklama');
            const aciklama = aciklamaInput.value.trim() || (tip === 'verdim' ? 'Mal/Borç Verildi' : 'Tahsilat Alındı');

            if (isNaN(tutar) || tutar <= 0) {
                alert('Lütfen geçerli bir tutar yazınız.');
                return;
            }

            const db = oku();
            const idx = db.findIndex(x => String(x.id) === String(targetId));

            if (idx !== -1) {
                let bak = Number(db[idx].bakiye) || 0;
                
                if (tip === 'verdim') {
                    bak += tutar; 
                } else {
                    bak -= tutar; 
                }

                db[idx].bakiye = bak;
                if (!db[idx].hareketler) db[idx].hareketler = [];

                db[idx].hareketler.unshift({
                    tarih: new Date().toLocaleDateString('tr-TR') + ' ' + new Date().toLocaleTimeString('tr-TR', {hour:'2-2', minute:'2-2'}),
                    aciklama: aciklama,
                    tip: tip,
                    tutar: tutar
                });

                yaz(db);
                tutarInput.value = '';
                aciklamaInput.value = '';
                
                detayAç(targetId);
                listele();
            } else {
                alert('Müşteri kaydı veritabanında bulunamadı.');
            }
        }

        function hareketCiz(liste) {
            const container = document.getElementById('mdlHareketler');
            container.innerHTML = '';

            if (!liste || liste.length === 0) {
                container.innerHTML = `<div class="text-center py-3 text-xs text-slate-400">İşlem geçmişi yok.</div>`;
                return;
            }

            liste.forEach(h => {
                const div = document.createElement('div');
                div.className = "bg-slate-50 p-2.5 rounded-xl border border-slate-200 flex justify-between items-center text-xs";
                const renk = h.tip === 'verdim' ? 'text-rose-600' : 'text-emerald-600';

                div.innerHTML = `
                    <div>
                        <span class="font-bold text-slate-700 block">${h.aciklama}</span>
                        <span class="text-[10px] text-slate-400">${h.tarih}</span>
                    </div>
                    <span class="font-extrabold ${renk}">${h.tip === 'verdim' ? '+' : '-'}${Number(h.tutar).toFixed(2)} ₺</span>
                `;
                container.appendChild(div);
            });
        }

        function duzenlePrompt() {
            const targetId = document.getElementById('mdlMusteriId').value;
            const db = oku();
            const m = db.find(x => String(x.id) === String(targetId));
            if (!m) return;

            const yeniAd = prompt("Müşteri Adını Güncelleyin:", m.ad);
            if (!yeniAd) return;
            const yeniTel = prompt("Telefon Numarasını Güncelleyin:", m.tel || "");

            const idx = db.findIndex(x => String(x.id) === String(targetId));
            if (idx !== -1) {
                db[idx].ad = yeniAd.trim();
                db[idx].tel = yeniTel ? yeniTel.trim() : '';
                yaz(db);
                detayAç(targetId);
                listele();
            }
        }

        function musteriSil() {
            const targetId = document.getElementById('mdlMusteriId').value;
            if (confirm('Bu müşteriyi ve tüm hesap geçmişini silmek istediğinize emin misiniz?')) {
                let db = oku();
                db = db.filter(x => String(x.id) !== String(targetId));
                yaz(db);
                modalKapat();
                listele();
            }
        }

        function yedekIndir() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(localStorage.getItem(KEY) || "[]");
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", "turkalp_musteri_yedek.json");
            document.body.appendChild(a);
            a.click();
            a.remove();
        }
    </script>
</body>
</html>
