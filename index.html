<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TürkAlp Teknoloji</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .custom-shadow {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .fab-shadow {
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 pb-24 select-none">

    <!-- Üst Başlık / Header -->
    <header class="bg-white px-4 py-3 flex justify-between items-center border-b border-slate-100 sticky top-0 z-20">
        <div class="flex items-center gap-2">
            <div class="text-blue-600 text-xl">
                <i class="fa-solid fa-book-open"></i>
            </div>
            <h1 class="font-bold text-slate-800 text-base tracking-tight">TürkAlp Teknoloji</h1>
        </div>
        <div class="flex items-center gap-2">
            <button class="w-10 h-10 rounded-xl bg-blue-50 text-blue-500 flex items-center justify-center text-lg active:scale-95 transition">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
            <button class="w-10 h-10 rounded-xl bg-blue-50 text-blue-500 flex items-center justify-center text-lg active:scale-95 transition">
                <i class="fa-solid fa-bell-slash"></i>
            </button>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-4">

        <!-- Müşteriler / Tedarikçiler Sekmeleri -->

            <button class="flex-1 py-3 rounded-xl bg-white text-blue-600 shadow-sm flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-user text-sm"></i> MÜŞTERİLER
            </button>
            <button class="flex-1 py-3 rounded-xl flex items-center justify-center gap-2 hover:text-slate-600 transition">
                <i class="fa-solid fa-truck text-sm"></i> TEDARİKÇİLER
            </button>
        </div>

        <!-- Özet Bakiye Kartı (Aldım / Verdim) -->
        <div class="bg-white p-4 rounded-2xl border border-slate-100 custom-shadow flex justify-between items-center">
            <div class="space-y-2">
                <div>
                    <span class="text-xs text-slate-400 font-semibold block">Aldım</span>
                    <span id="ozetAldim" class="text-lg font-bold text-emerald-500">0.0 ₺</span>
                </div>
                <div>
                    <span class="text-xs text-slate-400 font-semibold block">Verdim</span>
                    <span id="ozetVerdim" class="text-lg font-bold text-rose-500">0.0 ₺</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="alert('Tahsilat raporu yakında!')" class="flex flex-col items-center gap-1">
                    <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-500 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-bell"></i>
                    </div>
                    <span class="text-[10px] text-slate-400 font-medium">Tahsilat</span>
                </button>
                <button onclick="alert('Raporlar yakında!')" class="flex flex-col items-center gap-1">
                    <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-500 flex items-center justify-center text-lg">
                        <i class="fa-chart-column fa-solid"></i>
                    </div>
                    <span class="text-[10px] text-slate-400 font-medium">Raporlar</span>
                </button>
            </div>
        </div>

        <!-- Müşteri Arama & Filtre -->
        <div class="space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-blue-600 text-base">Müşteriler <span id="toplamSayi" class="text-slate-400 font-normal">(0)</span></h2>
            </div>
