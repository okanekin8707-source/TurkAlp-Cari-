<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TürkAlp - Alacak - Verecek Takibi</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 10px; color: #333; }
        .box { background: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ccc; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; margin-bottom: 8px; box-sizing: border-box; border: 1px solid #aaa; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #0066cc; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        .kisi { background: white; padding: 12px; border-radius: 6px; margin-bottom: 6px; border: 1px solid #ddd; cursor: pointer; }
        .kisi.red-bg { border-left: 6px solid #cc0000; background-color: #fff5f5; }
        .kisi.green-bg { border-left: 6px solid #009933; background-color: #f2fff2; }
        
        .panel { background: #e6f2ff; padding: 10px; border-radius: 6px; margin-top: 8px; border: 1px solid #b3d1ff; }
        .history { background: white; padding: 6px; border-radius: 4px; margin-top: 4px; font-size: 12px; border: 1px solid #eee; display: flex; justify-content: space-between; }
        .red { color: #cc0000; font-weight: bold; }
        .green { color: #009933; font-weight: bold; }
        #sifreEkrani { position: fixed; inset: 0; background: #f4f4f4; z-index: 999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        #yukleniyor { text-align: center; padding: 20px; color: #0066cc; font-weight: bold; }

        /* Başlık Stili */
        .baslik-ust { color: #cc0000; font-size: 24px; font-weight: bold; margin: 0; letter-spacing: 1px; line-height: 1.1; }
        .baslik-alt { color: #0066cc; font-size: 14px; margin-top: 2px; font-weight: bold; display: block; }

        /* Menü Stilleri */
        .menu-container { position: relative; display: inline-block; }
        .menu-content { display: none; position: absolute; right: 0; background-color: #f9f9f9; min-width: 140px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); z-index: 1; border-radius: 6px; border: 1px solid #ccc; overflow: hidden; }
        .menu-content button { background: white; color: #333; text-align: left; padding: 10px; border-radius: 0; border-bottom: 1px solid #eee; }
        .menu-content button:hover { background-color: #f1f1f1; }
        .menu-show { display: block; }
    </style>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDV0481BzK2YJnXhd0kMFx6QjN83XuhMkA",
          authDomain: "muhasebe-123ff.firebaseapp.com",
          projectId: "muhasebe-123ff",
          storageBucket: "muhasebe-123ff.firebasestorage.app",
          messagingSenderId: "570292769444",
          appId: "1:570292769444:web:7676ed70a4136132614c31",
          measurementId: "G-4HQVSFN45V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const SIFRE_KEY = 'turkalp_sifre_v1';
        const OTURUM_KEY = 'turkalp_oturum_acik';
        let globalListe = [];
        let seciliMusteriId = null;

        window.onload = function() {
            var kayitliSifre = localStorage.getItem(SIFRE_KEY);
            if (!kayitliSifre) {
                document.getElementById('sifreBilgi').textContent = "İlk kullanım için yeni bir şifre belirleyin:";
            } else {
                var oturumAcik = localStorage.getItem(OTURUM_KEY);
                if (oturumAcik === 'true') {
                    gizliEkraniKapat();
                }
            }
        };

        window.sifreKontrol = function() {
            var girilen = document.getElementById('girisSifre').value;
            var kayitliSifre = localStorage.getItem(SIFRE_KEY);

            if (!kayitliSifre) {
                if (girilen.trim() === "") {
                    alert("Şifre boş olamaz!");
                    return;
                }
                localStorage.setItem(SIFRE_KEY, girilen.trim());
                localStorage.setItem(OTURUM_KEY, 'true');
                alert("Şifreniz başarıyla kaydedildi!");
                gizliEkraniKapat();
            } else {
                if (girilen === kayitliSifre) {
                    localStorage.setItem(OTURUM_KEY, 'true');
                    gizliEkraniKapat();
                } else {
                    alert("Hatalı şifre!");
                    document.getElementById('girisSifre').value = "";
                }
            }
        };

        function gizliEkraniKapat() {
            document.getElementById('sifreEkrani').style.display = 'none';
            document.getElementById('anaUygulama').style.display = 'block';
            verileriBuluttanCek();
        }

        window.menuAcKapat = function() {
            document.getElementById('ayarlarMenu').classList.toggle('menu-show');
        };

        window.cikisYap = function() {
            localStorage.removeItem(OTURUM_KEY);
            location.reload();
        };

        window.sifreDegistir = function() {
            var eski = prompt("Mevcut şifrenizi girin:");
            var kayitliSifre = localStorage.getItem(SIFRE_KEY);
            if (eski === kayitliSifre) {
                var yeni = prompt("Yeni şifrenizi girin:");
                if (yeni && yeni.trim() !== "") {
                    localStorage.setItem(SIFRE_KEY, yeni.trim());
                    alert("Şifreniz değiştirildi!");
                } else {
                    alert("Geçersiz şifre.");
                }
            } else {
                alert("Eski şifre hatalı!");
            }
        };

        async function verileriBuluttanCek() {
            document.getElementById('yukleniyor').style.display = 'block';
            try {
                const querySnapshot = await getDocs(collection(db, "musteriler"));
                globalListe = [];
                querySnapshot.forEach((docSnap) => {
                    globalListe.push(docSnap.data());
                });
                globalListe.sort((a, b) => b.timestamp - a.timestamp);
            } catch (e) {
                console.error("Veri çekme hatası: ", e);
                alert("Buluttan veriler yüklenirken bir hata oluştu.");
            }
            document.getElementById('yukleniyor').style.display = 'none';
            listeyiEkranaBas();
        }

        window.kaydet = async function() {
            var adInput = document.getElementById('yeniAd');
            var ad = adInput.value.trim();

            if (ad === "") {
                alert("Lütfen müşteri adını yazınız!");
                return;
            }

            var idVal = 'm_' + Date.now();
            var yeniMusteri = {
                id: idVal,
                ad: ad,
                bakiye: 0,
                hareketler: [],
                timestamp: Date.now()
            };

            document.getElementById('yukleniyor').style.display = 'block';
            try {
                await setDoc(doc(db, "musteriler", idVal), yeniMusteri);
                adInput.value = "";
                await verileriBuluttanCek();
                alert("Müşteri buluta başarıyla kaydedildi!");
            } catch (e) {
                console.error("Kayıt hatası: ", e);
                alert("Kayıt sırasında hata oluştu.");
                document.getElementById('yukleniyor').style.display = 'none';
            }
        };

        window.listeyiEkranaBas = function() {
            var aramaMetni = document.getElementById('aramaKutusu').value.toLowerCase().trim();
            var container = document.getElementById('listeContainer');
            container.innerHTML = "";

            var filtrelenmisListe = globalListe.filter(function(m) {
                return m.ad.toLowerCase().includes(aramaMetni);
            });

            document.getElementById('sayac').textContent = filtrelenmisListe.length;

            if (filtrelenmisListe.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#777; padding:10px;">Kayıtlı müşteri bulunamadı.</div>';
                return;
            }

            filtrelenmisListe.forEach(function(m) {
                var bakiye = Number(m.bakiye) || 0;
                var renk = bakiye > 0 ? 'red' : (bakiye < 0 ? 'green' : '');
                var bgClass = bakiye > 0 ? 'red-bg' : (bakiye < 0 ? 'green-bg' : '');
                var durumMetni = bakiye > 0 ? 'Alacaklısınız (Borçlu)' : (bakiye < 0 ? 'Borçlusunuz (Alacaklı)' : 'Dengede');

                var div = document.createElement('div');
                div.className = 'kisi';
                if (bgClass) div.classList.add(bgClass);
                
                var icerik = '<div onclick="sec(\'' + m.id + '\')" style="display:flex; justify-content:space-between; align-items:center;">' +
                    '<div>' +
                        '<b style="font-size:16px;">👤 ' + m.ad + '</b>' +
                    '</div>' +
                    '<div style="text-align:right;">' +
                        '<span class="' + renk + '" style="font-size:15px;">' + Math.abs(bakiye).toFixed(2) + ' ₺</span><br>' +
                        '<span style="font-size:11px;" class="' + renk + '">' + durumMetni + '</span>' +
                    '</div>' +
                '</div>';

                if (String(m.id) === String(seciliMusteriId)) {
                    icerik += '<div class="panel">' +
                        '<b>İşlem / Malzeme Ekle</b><br>' +
                        '<label>İşlem Türü:</label>' +
                        '<select id="islemTip_' + m.id + '">' +
                            '<option value="verdim">Mal/Borç Verdim (+ Artırır)</option>' +
                            '<option value="aldim">Para/Tahsilat Aldım (- Düşer)</option>' +
                        '</select>' +
                        '<label>Tutar (₺):</label>' +
                        '<input type="number" step="0.01" id="islemTutar_' + m.id + '" placeholder="0.00">' +
                        '<label>Açıklama:</label>' +
                        '<input type="text" id="islemAciklama_' + m.id + '" placeholder="Örn: Nakit / Malzeme">' +
                        '<button onclick="islemYap(\'' + m.id + '\')" style="background:#009933;">İşlemi Kaydet ve Hesapla</button>' +
                        
                        '<hr style="margin:10px 0; border:0; border-top:1px solid #ccc;">' +
                        '<b>Hesap Geçmişi:</b>';

                    if (m.hareketler && m.hareketler.length > 0) {
                        m.hareketler.forEach(function(h) {
                            var hRenk = h.tip === 'verdim' ? 'red' : 'green';
                            icerik += '<div class="history">' +
                                '<span><b>' + h.aciklama + '</b> <small>(' + h.tarih + ')</small></span>' +
                                '<span class="' + hRenk + '">' + (h.tip === 'verdim' ? '+' : '-') + Number(h.tutar).toFixed(2) + ' ₺</span>' +
                            '</div>';
                        });
                    } else {
                        icerik += '<div style="font-size:12px; color:#777; margin-top:4px;">İşlem geçmişi yok.</div>';
                    }

                    icerik += '<div style="text-align:right; margin-top:8px;">' +
                        '<button onclick="musteriSil(\'' + m.id + '\')" style="width:auto; padding:6px 12px; background:#cc0000; font-size:11px;">Müşteriyi Sil</button>' +
                    '</div>';

                    icerik += '</div>';
                }

                div.innerHTML = icerik;
                container.appendChild(div);
            });
        };

        window.sec = function(id) {
            if (seciliMusteriId === id) {
                seciliMusteriId = null;
            } else {
                seciliMusteriId = id;
            }
            listeyiEkranaBas();
        };

        window.islemYap = async function(id) {
            var tip = document.getElementById('islemTip_' + id).value;
            var tutarVal = document.getElementById('islemTutar_' + id).value;
            var aciklamaVal = document.getElementById('islemAciklama_' + id).value.trim();

            var tutar = parseFloat(tutarVal);
            if (isNaN(tutar) || tutar <= 0) {
                alert("Lütfen geçerli bir tutar giriniz!");
                return;
            }

            if (!aciklamaVal) {
                aciklamaVal = tip === 'verdim' ? 'Mal/Borç Verildi' : 'Tahsilat Alındı';
            }

            var index = globalListe.findIndex(function(x) { return String(x.id) === String(id); });

            if (index !== -1) {
                var mevcutBakiye = Number(globalListe[index].bakiye) || 0;

                if (tip === 'verdim') {
                    mevcutBakiye += tutar;
                } else {
                    mevcutBakiye -= tutar;
                }

                globalListe[index].bakiye = mevcutBakiye;
                if (!globalListe[index].hareketler) globalListe[index].hareketler = [];

                globalListe[index].hareketler.unshift({
                    tarih: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString(),
                    aciklama: aciklamaVal,
                    tip: tip,
                    tutar: tutar
                });

                document.getElementById('yukleniyor').style.display = 'block';
                try {
                    await setDoc(doc(db, "musteriler", id), globalListe[index]);
                    await verileriBuluttanCek();
                    alert("İşlem buluta başarıyla kaydedildi!");
                } catch (e) {
                    console.error("İşlem hatası: ", e);
                    alert("İşlem kaydedilirken hata oluştu.");
                    document.getElementById('yukleniyor').style.display = 'none';
                }
            }
        };

        window.musteriSil = async function(id) {
            if (confirm("Bu müşteriyi silmek istediğinize emin misiniz?")) {
                document.getElementById('yukleniyor').style.display = 'block';
                try {
                    await deleteDoc(doc(db, "musteriler", id));
                    seciliMusteriId = null;
                    await verileriBuluttanCek();
                    alert("Müşteri silindi!");
                } catch (e) {
                    console.error("Silme hatası: ", e);
                    alert("Silme sırasında hata oluştu.");
                    document.getElementById('yukleniyor').style.display = 'none';
                }
            }
        };
    </script>
</head>
<body>

    <!-- ŞİFRE GİRİŞ EKRANI -->
    <div id="sifreEkrani">
        <div class="box" style="width: 100%; max-width: 320px; text-align: center;">
            <div style="margin-bottom: 15px;">
                <h2 class="baslik-ust">TÜRKALP</h2>
                <span class="baslik-alt">Alacak - Verecek Takibi</span>
            </div>
            <p id="sifreBilgi" style="font-size: 13px; color: #666;">Lütfen giriş şifrenizi girin:</p>
            <input type="password" id="girisSifre" placeholder="Şifre" style="text-align: center; font-size: 16px;">
            <button onclick="sifreKontrol()">Giriş Yap</button>
        </div>
    </div>

    <!-- ANA UYGULAMA -->
    <div id="anaUygulama" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div>
                <h2 class="baslik-ust">TÜRKALP</h2>
                <span class="baslik-alt">Alacak - Verecek Takibi</span>
            </div>
            
            <!-- AÇILIR MENÜ ALANI -->
            <div class="menu-container">
                <button onclick="menuAcKapat()" style="width: auto; padding: 8px 14px; background: #444; font-size: 14px;">⚙️ Menü</button>
                <div id="ayarlarMenu" class="menu-content">
                    <button onclick="sifreDegistir()">🔑 Şifre Değiştir</button>
                    <button onclick="cikisYap()" style="color: #cc0000;">🚪 Çıkış Yap</button>
                </div>
            </div>
        </div>

        <!-- YENİ MÜŞTERİ EKLEME -->
        <div class="box">
            <label>Yeni Müşteri:</label>
            <input type="text" id="yeniAd" placeholder="Müşteri adı...">
            <button onclick="kaydet()">Kaydet</button>
        </div>

        <!-- MÜŞTERİ ARAMA KUTUSU -->
        <div class="box">
            <b>Müşteri Ara</b>
            <input type="text" id="aramaKutusu" oninput="listeyiEkranaBas()" placeholder="İsim yazarak ara...">
        </div>

        <div id="yukleniyor">Veriler buluttan yükleniyor...</div>

        <!-- LİSTE -->
        <h3>Müşteri Listesi (<span id="sayac">0</span>)</h3>
        <div id="listeContainer"></div>
    </div>
</body>
</html>
