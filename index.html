<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TürkAlp Teknoloji - Ön Muhasebe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-24 select-none">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-20 flex justify-between items-center">
        <h1 class="font-bold text-base flex items-center gap-2">
            <i class="fa-solid fa-book-open"></i> TürkAlp Teknoloji
        </h1>
        <span class="text-xs bg-blue-700 px-2.5 py-1 rounded-lg">Ön Muhasebe v8</span>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-4">

        <!-- SEKME SEÇİMİ (MÜŞTERİLER / TOPTANCILAR) -->
        <div class="bg-slate-200 p-1 rounded-xl flex text-xs font-bold">
            <button type="button" id="btnMusteriTab" onclick="sekmeDegis('musteri')" class="flex-1 py-2.5 rounded-lg bg-white text-blue-600 shadow-sm transition">
                <i class="fa-solid fa-users mr-1"></i> MÜŞTERİLER
            </button>
            <button type="button" id="btnToptanciTab" onclick="sekmeDegis('toptanci')" class="flex-1 py-2.5 rounded-lg text-slate-500 transition">
                <i class="fa-solid fa-truck mr-1"></i> TOPTANCILAR
            </button>
        </div>

        <!-- KAYIT EKLEME FORMU -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <h2 id="formBaslik" class="font-bold text-slate-700 text-sm border-b pb-2 flex justify-between items-center">
                <span><i class="fa-solid fa-user-plus text-blue-600 mr-1"></i> Yeni Müşteri Ekle</span>
                <button type="button" onclick="topluEkleToggle()" class="text-xs text-blue-600 font-normal hover:underline">
                    Toplu Ekle
                </button>
            </h2>

            <!-- Tekli Ekleme -->
            <div id="tekliForm" class="space-y-2">
                <div>
                    <label id="etiketAd" class="block text-xs font-bold text-slate-600 mb-1">Müşteri / Firma Adı *</label>
                    <input type="text" id="mAdInput" placeholder="Örn: Ahmet Yılmaz" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Telefon</label>
                        <input type="tel" id="mTelInput" placeholder="05XX..." class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Bakiyesi (₺)</label>
                        <input type="number" step="0.01" id="mBakInput" placeholder="0.00" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-500">
                    </div>
                </div>
                <button type="button" onclick="kayitEkle()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-3 rounded-xl text-sm shadow transition">
                    + Kaydı Ekle
                </button>
            </div>

            <!-- Toplu Ekleme Kutusu -->
            <div id="topluForm" class="space-y-2 hidden">
                <p class="text-xs text-slate-500">İsimleri alt alta yazarak tek seferde ekleyin:</p>
                <textarea id="topluMetin" rows="4" placeholder="İsim 1&#10;İsim 2" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs outline-none"></textarea>
                <button type="button" onclick="topluKaydet()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-2.5 rounded-xl text-xs transition">
                    Toplu Kayıtları Ekle
                </button>
            </div>
        </div>

        <!-- ÖZET BİLGİ -->
        <div class="bg-white p-3.5 rounded-2xl border border-slate-200 flex justify-between items-center text-xs">
            <div>
                <span class="text-slate-400 font-semibold block">Toplam Borç (Verdim)</span>
                <span id="toplamVerdim" class="text-base font-bold text-rose-500">0.0 ₺</span>
            </div>
            <div class="text-right">
                <span class="text-slate-400 font-semibold block">Toplam Alacak (Aldım)</span>
                <span id="toplamAldim" class="text-base font-bold text-emerald-500">0.0 ₺</span>
            </div>
        </div>

        <!-- LİSTE VE ARAMA -->
        <div class="space-y-2">
            <div class="flex justify-between items-center">
                <h3 id="listeBaslik" class="font-bold text-slate-700 text-sm">Müşteriler <span id="sayac" class="text-slate-400 font-normal">(0)</span></h3>
                <input type="text" id="aramaBox" oninput="listele()" placeholder="Ara..." class="p-1.5 px-3 bg-white border rounded-xl text-xs outline-none w-32">
            </div>

            <div id="listeContainer" class="space-y-2">
                <!-- Kayıtlar buraya gelecek -->
            </div>
        </div>

    </main>

    <!-- DETAY MODALI (ÜRÜN / İŞLEM EKLEME) -->
    <div id="detayModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-sm p-4 space-y-3 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <div>
                    <h3 id="mAd" class="font-bold text-slate-800 text-base">Ad</h3>
                    <p id="mTel" class="text-xs text-slate-400"></p>
                </div>
                <button type="button" onclick="modalKapat()" class="text-slate-400 text-lg font-bold px-2 py-1">✕</button>
            </div>

            <div class="bg-slate-50 p-3 rounded-xl text-center border">
                <span class="text-[10px] text-slate-400 font-bold block">GÜNCEL BAKİYE</span>
                <span id="mBakiye" class="text-xl font-extrabold text-blue-600">0.0 ₺</span>
            </div>

            <!-- İşlem / Ürün Ekleme Formu -->
            <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 space-y-2">
                <h4 class="text-xs font-bold text-blue-900">ÜRÜN / İŞLEM EKLE</h4>
                <div class="grid grid-cols-2 gap-2">
                    <select id="iTip" class="p-2 bg-white border rounded-lg text-xs outline-none">
                        <option value="verdim">Verdim / Borç (+)</option>
                        <option value="aldim">Aldım / Ödeme (-)</option>
                    </select>
                    <input type="number" step="0.01" id="iTutar" placeholder="Tutar (₺)" class="p-2 bg-white border rounded-lg text-xs outline-none">
                </div>
                <input type="text" id="iAciklama" placeholder="Ürün veya Açıklama (Örn: Servis)" class="w-full p-2 bg-white border rounded-lg text-xs outline-none">
                <button type="button" onclick="islemEkle()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-2.5 rounded-lg text-xs transition shadow">
                    İşlemi / Ürünü Kaydet
                </button>
            </div>

            <div>
                <h4 class="text-xs font-bold text-slate-700 mb-1">Hesap Geçmişi</h4>
                <div id="mHareketler" class="space-y-1 max-h-36 overflow-y-auto pr-1"></div>
            </div>

            <div class="border-t pt-2 text-right">
                <button type="button" onclick="kayitSil()" class="text-rose-600 text-xs font-bold py-1 px-2">Kaydı Sil</button>
            </div>
        </div>
    </div>

    <script>
        const KEY = 'turkalp_muhasebe_v8';
        let aktifSekme = 'musteri';
        let aktifId = null;

        document.addEventListener('DOMContentLoaded', function() {
            listele();
        });

        function veriOku() {
            const d = localStorage.getItem(KEY);
            if (d) {
                try {
                    const p = JSON.parse(d);
                    return {
                        musteri: Array.isArray(p.musteri) ? p.musteri : [],
                        toptanci: Array.isArray(p.toptanci) ? p.toptanci : []
                    };
                } catch(e) {
                    return { musteri: [], toptanci: [] };
                }
            }
            return { musteri: [], toptanci: [] };
        }

        function veriYaz(data) {
            localStorage.setItem(KEY, JSON.stringify(data));
        }

        function sekmeDegis(sekme) {
            aktifSekme = sekme;
            const mTab = document.getElementById('btnMusteriTab');
            const tTab = document.getElementById('btnToptanciTab');
            const formBaslik = document.getElementById('formBaslik');
            const etiketAd = document.getElementById('etiketAd');
            const listeBaslik = document.getElementById('listeBaslik');

            if (sekme === 'musteri') {
                mTab.className = "flex-1 py-2.5 rounded-lg bg-white text-blue-600 shadow-sm transition";
                tTab.className = "flex-1 py-2.5 rounded-lg text-slate-500 transition";
                formBaslik.querySelector('span').innerHTML = '<i class="fa-solid fa-user-plus text-blue-600 mr-1"></i> Yeni Müşteri Ekle';
                etiketAd.textContent = 'Müşteri / Firma Adı *';
                listeBaslik.innerHTML = 'Müşteriler <span id="sayac" class="text-slate-400 font-normal">(0)</span>';
            } else {
                tTab.className = "flex-1 py-2.5 rounded-lg bg-white text-blue-600 shadow-sm transition";
                mTab.className = "flex-1 py-2.5 rounded-lg text-slate-500 transition";
                formBaslik.querySelector('span').innerHTML = '<i class="fa-solid fa-truck-field text-blue-600 mr-1"></i> Yeni Toptancı Ekle';
                etiketAd.textContent = 'Toptancı / Firma Adı *';
                listeBaslik.innerHTML = 'Toptancılar <span id="sayac" class="text-slate-400 font-normal">(0)</span>';
            }
            listele();
        }

        function topluEkleToggle() {
            document.getElementById('tekliForm').classList.toggle('hidden');
            document.getElementById('topluForm').classList.toggle('hidden');
        }

        function kayitEkle() {
            const ad = document.getElementById('mAdInput').value.trim();
            const tel = document.getElementById('mTelInput').value.trim();
            const bak = parseFloat(document.getElementById('mBakInput').value) || 0;

            if (!ad) {
                alert('Lütfen isim yazın.');
                return;
            }

            const db = veriOku();
            db[aktifSekme].unshift({
                id: String(Date.now()),
                unvan: ad,
                telefon: tel,
                bakiye: bak,
                hareketler: bak !== 0 ? [{ 
                    tarih: new Date().toLocaleDateString('tr-TR'), 
                    aciklama: 'Açılış Bakiyesi', 
                    tip: bak > 0 ? 'verdim' : 'aldim', 
                    tutar: Math.abs(bak) 
                }] : []
            });

            veriYaz(db);
            document.getElementById('mAdInput').value = '';
