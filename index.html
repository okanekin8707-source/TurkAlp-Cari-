<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TürkAlp Teknoloji - Ön Muhasebe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-20">

    <!-- Üst Başlık -->
    <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-20 flex justify-between items-center">
        <h1 class="font-bold text-base flex items-center gap-2">
            <i class="fa-solid fa-calculator"></i> TürkAlp Teknoloji
        </h1>
        <span class="text-xs bg-blue-900 px-2 py-1 rounded font-semibold">Ön Muhasebe</span>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-4">

        <!-- Kategori Seçimi (Müşteriler / Toptancılar) -->
        <div class="bg-slate-200 p-1 rounded-xl flex text-xs font-bold">
            <button id="tabMusteri" onclick="kategoriDegis('musteriler')" class="flex-1 py-2.5 rounded-lg bg-white text-blue-700 shadow-sm transition">
                <i class="fa-solid fa-users mr-1"></i> MÜŞTERİLER
            </button>
            <button id="tabToptanci" onclick="kategoriDegis('toptancilar')" class="flex-1 py-2.5 rounded-lg text-slate-600 transition">
                <i class="fa-solid fa-truck mr-1"></i> TOPTANCILAR
            </button>
        </div>

        <!-- Yeni Kişi Ekleme Formu -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 id="formBaslik" class="font-bold text-slate-700 text-sm">
                    <i class="fa-solid fa-user-plus text-blue-600 mr-1"></i> Yeni Müşteri Ekle
                </h2>
                <button onclick="topluFormToggle()" class="text-xs text-blue-600 font-semibold underline">Toplu Ekle</button>
            </div>

            <!-- Tekli Ekleme -->
            <div id="tekliEkleBox" class="space-y-2">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Ad Soyad / Firma Adı *</label>
                    <input type="text" id="inputAd" placeholder="Örn: Ahmet Yılmaz" class="w-full p-2.5 bg-slate-50 border rounded-xl text-sm outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Telefon</label>
                        <input type="tel" id="inputTel" placeholder="05XX..." class="w-full p-2.5 bg-slate-50 border rounded-xl text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Başlangıç Bakiyesi</label>
                        <input type="number" step="0.01" id="inputBakiye" placeholder="0.00" class="w-full p-2.5 bg-slate-50 border rounded-xl text-sm outline-none">
                    </div>
                </div>
                <button onclick="kisiEkle()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-3 rounded-xl text-sm shadow transition">
                    + Kişiyi Kaydet
                </button>
            </div>

            <!-- Toplu Ekleme -->
            <div id="topluEkleBox" class="space-y-2 hidden">
                <label class="block text-xs font-bold text-slate-600">İsimleri alt alta yazın:</label>
                <textarea id="topluMetin" rows="4" placeholder="Ahmet Yılmaz&#10;Mehmet Demir&#10;Örnek Ticaret" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none"></textarea>
                <button onclick="topluKisiEkle()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition">
                    Toplu Kişileri Ekle
                </button>
            </div>
        </div>

        <!-- Toplam Özet Kartı -->
        <div class="bg-white p-3.5 rounded-2xl border border-slate-200 flex justify-between items-center text-xs">
            <div>
                <span class="text-slate-400 font-semibold block">Sana Borçlu Olunan (Verdin)</span>
                <span id="ozetBorc" class="text-base font-bold text-rose-600">0.00 ₺</span>
            </div>
            <div class="text-right">
                <span class="text-slate-400 font-semibold block">Senin Borçlu Olduğun (Aldın)</span>
                <span id="ozetAlacak" class="text-base font-bold text-emerald-600">0.00 ₺</span>
            </div>
        </div>

        <!-- Liste ve Arama -->
        <div class="space-y-2">
            <div class="flex justify-between items-center">
                <h3 id="listeBaslik" class="font-bold text-slate-700 text-sm">Müşteriler <span id="kisiSayisi" class="text-slate-400 font-normal">(0)</span></h3>
                <input type="text" id="aramaInput" oninput="listeyiCiz()" placeholder="Listede ara..." class="p-1.5 px-3 bg-white border rounded-xl text-xs outline-none w-36">
            </div>

            <div id="kisiListesi" class="space-y-2">
                <!-- Kişiler buraya yüklenecek -->
            </div>
        </div>

    </main>

    <!-- KİŞİ DETAY / BORÇ-ALACAK EKLEME PENCERESİ -->
    <div id="detayModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-sm p-4 space-y-3 shadow-2xl max-h-[90vh] overflow-y-auto">
            
            <div class="flex justify-between items-start border-b pb-2">
                <div>
                    <h3 id="modalAd" class="font-bold text-slate-800 text-base">Kişi Adı</h3>
                    <p id="modalTel" class="text-xs text-slate-400"></p>
                </div>
                <button onclick="modalKapat()" class="text-slate-400 text-xl font-bold px-2">✕</button>
            </div>

            <!-- Bakiye Göstergesi -->
            <div class="bg-slate-50 p-3 rounded-xl text-center border">
                <span class="text-[10px] text-slate-400 font-bold block">GÜNCEL BAKİYE DURUMU</span>
                <span id="modalBakiye" class="text-xl font-extrabold">0.00 ₺</span>
            </div>

            <!-- İşlem / Malzeme / Para Ekleme Formu -->
            <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 space-y-2">
                <h4 class="text-xs font-bold text-blue-900">İŞLEM / ALACAK-BORÇ EKLE</h4>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Yapılan İşlem</label>
                        <select id="islemTipi" class="w-full p-2 bg-white border rounded-lg text-xs outline-none font-medium">
                            <option value="verdim">Malzeme/Borç Verdim (+)</option>
                            <option value="aldim">Para/Tahsilat Aldım (-)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Tutar (₺)</label>
                        <input type="number" step="0.01" id="islemTutar" placeholder="0.00" class="w-full p-2 bg-white border rounded-lg text-xs outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Açıklama</label>
                    <input type="text" id="islemAciklama" placeholder="Örn: 5.000 TL Malzeme / 10.000 TL Nakit" class="w-full p-2 bg-white border rounded-lg text-xs outline-none">
                </div>
                <button onclick="islemEkle()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-xs shadow transition">
                    İşlemi Kaydet ve Hesapla
                </button>
            </div>

            <!-- Hesap Geçmişi -->
