<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TürkAlp Teknoloji - Müşteri Takip v20</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 10px; color: #333; }
        .box { background: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ccc; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; margin-bottom: 8px; box-sizing: border-box; border: 1px solid #aaa; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #0066cc; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .kisi { background: white; padding: 10px; border-radius: 6px; margin-bottom: 6px; border: 1px solid #ddd; cursor: pointer; }
        .panel { background: #e6f2ff; padding: 10px; border-radius: 6px; margin-top: 8px; border: 1px solid #b3d1ff; }
        .history { background: white; padding: 6px; border-radius: 4px; margin-top: 4px; font-size: 12px; border: 1px solid #eee; display: flex; justify-content: space-between; }
        .red { color: #cc0000; font-weight: bold; }
        .green { color: #009933; font-weight: bold; }
    </style>
</head>
<body>

    <h2 style="text-align:center; color:#0066cc; margin-bottom:10px;">TürkAlp Müşteri Takip v20</h2>

    <!-- YENİ MÜŞTERİ EKLEME -->
    <div class="box">
        <b>Yeni Müşteri Ekle</b>
        <label>Müşteri Adı:</label>
        <input type="text" id="yeniAd" placeholder="Örn: Ahmet Yılmaz">
        
        <label>Telefon:</label>
        <input type="text" id="yeniTel" placeholder="05XX...">
        
        <label>Açılış Bakiyesi (₺):</label>
        <input type="number" step="0.01" id="yeniBak" placeholder="0.00">
        
        <button onclick="kaydet()">Müşteriyi Kaydet</button>
    </div>

    <!-- MÜŞTERİ ARAMA KUTUSU -->
    <div class="box">
        <b>Müşteri Ara</b>
        <input type="text" id="aramaKutusu" oninput="listeyiEkranaBas()" placeholder="İsim yazarak ara...">
    </div>

    <!-- LİSTE -->
    <h3>Müşteri Listesi (<span id="sayac">0</span>)</h3>
    <div id="listeContainer"></div>

    <script>
        function verileriAl() {
            var veri = localStorage.getItem('turkalp_v19_db');
            if (!veri) return [];
            try { return JSON.parse(veri); } catch(e) { return []; }
        }

        function verileriYaz(arr) {
            localStorage.setItem('turkalp_v19_db', JSON.stringify(arr));
        }

        var seciliMusteriId = null;

        function kaydet() {
            var adInput = document.getElementById('yeniAd');
            var telInput = document.getElementById('yeniTel');
            var bakInput = document.getElementById('yeniBak');

            var ad = adInput.value.trim();
            var tel = telInput.value.trim();
            var bak = parseFloat(bakInput.value) || 0;

            if (ad === "") {
                alert("Lütfen müşteri adını yazınız!");
                return;
            }

            var liste = verileriAl();
            
            var yeniMusteri = {
                id: 'm_' + Date.now(),
                ad: ad,
                tel: tel,
                bakiye: bak,
                hareketler: bak !== 0 ? [{
                    tarih: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString(),
                    aciklama: 'Açılış Bakiyesi',
                    tip: bak > 0 ? 'verdim' : 'aldim',
                    tutar: Math.abs(bak)
                }] : []
            };

            liste.unshift(yeniMusteri);
            verileriYaz(liste);

            adInput.value = "";
            telInput.value = "";
            bakInput.value = "";

            listeyiEkranaBas();
            alert("Müşteri başarıyla eklendi!");
        }

        function listeyiEkranaBas() {
            var liste = verileriAl();
            var aramaMetni = document.getElementById('aramaKutusu').value.toLowerCase().trim();
            var container = document.getElementById('listeContainer');
            container.innerHTML = "";

            // Arama filtresi uygula
            var filtrelenmisListe = liste.filter(function(m) {
                return m.ad.toLowerCase().includes(aramaMetni);
            });

            document.getElementById('sayac').textContent = filtrelenmisListe.length;

            if (filtrelenmisListe.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#777; padding:10px;">Kayıtlı müşteri bulunamadı.</div>';
                return;
            }

            filtrelenmisListe.forEach(function(m) {
                var bakiye = Number(m.bakiye) || 0;
                var renk = bakiye > 0 ? 'red' : (bakiye < 0 ? 'green' : '');
                var durumMetni = bakiye > 0 ? 'Borçlu (Sana)' : (bakiye < 0 ? 'Alacaklı (Senden)' : 'Dengede');

                var div = document.createElement('div');
                div.className = 'kisi';
                
                var icerik = '<div onclick="sec(\'' + m.id + '\')" style="display:flex; justify-content:space-between; align-items:center;">' +
                    '<div>' +
                        '<b style="font-size:15px;">' + m.ad + '</b><br>' +
                        '<span style="font-size:12px; color:#666;">' + (m.tel || 'Telefon yok') + '</span>' +
                    '</div>' +
                    '<div style="text-align:right;">' +
                        '<span class="' + renk + '" style="font-size:15px;">' + Math.abs(bakiye).toFixed(2) + ' ₺</span><br>' +
                        '<span style="font-size:11px;" class="' + renk + '">' + durumMetni + '</span>' +
                    '</div>' +
                '</div>';

                if (String(m.id) === String(seciliMusteriId)) {
                    icerik += '<div class="panel">' +
                        '<b>İşlem / Malzeme Ekle</b><br>' +
                        '<label>İşlem Türü:</label>' +
                        '<select id="islemTip_' + m.id + '">' +
                            '<option value="verdim">Mal/Borç Verdim (+ Artırır)</option>' +
                            '<option value="aldim">Para/Tahsilat Aldım (- Düşer)</option>' +
                        '</select>' +
                        '<label>Tutar (₺):</label>' +
                        '<input type="number" step="0.01" id="islemTutar_' + m.id + '" placeholder="0.00">' +
                        '<label>Açıklama:</label>' +
                        '<input type="text" id="islemAciklama_' + m.id + '" placeholder="Örn: Nakit / Malzeme">' +
                        '<button onclick="islemYap(\'' + m.id + '\')" style="background:#009933;">İşlemi Kaydet ve Hesapla</button>' +
                        
                        '<hr style="margin:10px 0; border:0; border-top:1px solid #ccc;">' +
                        '<b>Hesap Geçmişi:</b>';

                    if (m.hareketler && m.hareketler.length > 0) {
                        m.hareketler.forEach(function(h) {
                            var hRenk = h.tip === 'verdim' ? 'red' : 'green';
                            icerik += '<div class="history">' +
                                '<span><b>' + h.aciklama + '</b> <small>(' + h.tarih + ')</small></span>' +
                                '<span class="' + hRenk + '">' + (h.tip === 'verdim' ? '+' : '-') + Number(h.tutar).toFixed(2) + ' ₺</span>' +
                            '</div>';
                        });
                    } else {
                        icerik += '<div style="font-size:12px; color:#777; margin-top:4px;">İşlem geçmişi yok.</div>';
                    }

                    icerik += '<div style="text-align:right; margin-top:8px;">' +
                        '<button onclick="musteriSil(\'' + m.id + '\')" style="width:auto; padding:6px 12px; background:#cc0000; font-size:11px;">Müşteriyi Sil</button>' +
                    '</div>';

                    icerik += '</div>';
                }

                div.innerHTML = icerik;
                container.appendChild(div);
            });
        }

        function sec(id) {
            if (seciliMusteriId === id) {
                seciliMusteriId = null;
            } else {
                seciliMusteriId = id;
            }
            listeyiEkranaBas();
        }

        function islemYap(id) {
            var tip = document.getElementById('islemTip_' + id).value;
            var tutarVal = document.getElementById('islemTutar_' + id).value;
            var aciklamaVal = document.getElementById('islemAciklama_' + id).value.trim();

            var tutar = parseFloat(tutarVal);
            if (isNaN(tutar) || tutar <= 0) {
                alert("Lütfen geçerli bir tutar giriniz!");
                return;
            }

            if (!aciklamaVal) {
                aciklamaVal = tip === 'verdim' ? 'Mal/Borç Verildi' : 'Tahsilat Alındı';
            }

            var liste = verileriAl();
            var index = liste.findIndex(function(x) { return String(x.id) === String(id); });

            if (index !== -1) {
                var mevcutBakiye = Number(liste[index].bakiye) || 0;

                if (tip === 'verdim') {
                    mevcutBakiye += tutar;
                } else {
                    mevcutBakiye -= tutar;
                }

                liste[index].bakiye = mevcutBakiye;
                if (!liste[index].hareketler) liste[index].hareketler = [];

                liste[index].hareketler.unshift({
                    tarih: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString(),
                    aciklama: aciklamaVal,
                    tip: tip,
                    tutar: tutar
                });

                verileriYaz(liste);
                listeyiEkranaBas();
                alert("İşlem başarıyla kaydedildi!");
            }
        }

        function musteriSil(id) {
            if (confirm("Bu müşteriyi silmek istediğinize emin misiniz?")) {
                var liste = verileriAl();
                liste = liste.filter(function(x) { return String(x.id) !== String(id); });
                verileriYaz(liste);
                seciliMusteriId = null;
                listeyiEkranaBas();
            }
        }

        window.onload = function() {
            listeyiEkranaBas();
        };
    </script>
</body>
</html>
