<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TürkAlp Teknoloji - Müşteri Takip v23</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 10px; color: #333; }
        .box { background: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ccc; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; margin-bottom: 8px; box-sizing: border-box; border: 1px solid #aaa; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #0066cc; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .kisi { background: white; padding: 10px; border-radius: 6px; margin-bottom: 6px; border: 1px solid #ddd; cursor: pointer; }
        .panel { background: #e6f2ff; padding: 10px; border-radius: 6px; margin-top: 8px; border: 1px solid #b3d1ff; }
        .history { background: white; padding: 6px; border-radius: 4px; margin-top: 4px; font-size: 12px; border: 1px solid #eee; display: flex; justify-content: space-between; }
        .red { color: #cc0000; font-weight: bold; }
        .green { color: #009933; font-weight: bold; }
        #sifreEkrani { position: fixed; inset: 0; background: #f4f4f4; z-index: 999; display: flex; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>

    <!-- ŞİFRE GİRİŞ EKRANI -->
    <div id="sifreEkrani">
        <div class="box" style="width: 100%; max-width: 320px; text-align: center;">
            <h3 style="color: #0066cc; margin-top: 0;">TürkAlp Güvenlik</h3>
            <p id="sifreBilgi" style="font-size: 13px; color: #666;">Lütfen giriş şifrenizi girin:</p>
            <input type="password" id="girisSifre" placeholder="Şifre" style="text-align: center; font-size: 16px;">
            <button onclick="sifreKontrol()">Giriş Yap</button>
        </div>
    </div>

    <!-- ANA UYGULAMA -->
    <div id="anaUygulama" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="color:#0066cc; margin:0;">TürkAlp Müşteri Takip v23</h2>
            <button onclick="sifreDegistir()" style="width: auto; padding: 5px 10px; font-size: 11px; background: #666;">Şifre Değiştir</button>
        </div>

        <!-- YENİ MÜŞTERİ EKLEME -->
        <div class="box">
            <b>Yeni Müşteri Ekle</b>
            <label>Müşteri Adı:</label>
            <input type="text" id="yeniAd" placeholder="Örn: Ahmet Yılmaz">
            <button onclick="kaydet()">Müşteriyi Kaydet</button>
        </div>

        <!-- MÜŞTERİ ARAMA KUTUSU -->
        <div class="box">
            <b>Müşteri Ara</b>
            <input type="text" id="aramaKutusu" oninput="listeyiEkranaBas()" placeholder="İsim yazarak ara...">
        </div>

        <!-- LİSTE -->
        <h3>Müşteri Listesi (<span id="sayac">0</span>)</h3>
        <div id="listeContainer"></div>
    </div>

    <script>
        const SIFRE_KEY = 'turkalp_sifre_v1';

        window.onload = function() {
            var kayitliSifre = localStorage.getItem(SIFRE_KEY);
            if (!kayitliSifre) {
                document.getElementById('sifreBilgi').textContent = "İlk kullanım için yeni bir şifre belirleyin:";
            }
        };

        function sifreKontrol() {
            var girilen = document.getElementById('girisSifre').value;
            var kayitliSifre = localStorage.getItem(SIFRE_KEY);

            if (!kayitliSifre) {
                if (girilen.trim() === "") {
                    alert("Şifre boş olamaz!");
                    return;
                }
                localStorage.setItem(SIFRE_KEY, girilen.trim());
                alert("Şifreniz başarıyla kaydedildi!");
                gizliEkraniKapat();
            } else {
                if (girilen === kayitliSifre) {
                    gizliEkraniKapat();
                } else {
                    alert("Hatalı şifre!");
                    document.getElementById('girisSifre').value = "";
                }
            }
        }

        function gizliEkraniKapat() {
            document.getElementById('sifreEkrani').style.display = 'none';
            document.getElementById('anaUygulama').style.display = 'block';
            listeyiEkranaBas();
        }

        function sifreDegistir() {
            var eski = prompt("Mevcut şifrenizi girin:");
            var kayitliSifre = localStorage.getItem(SIFRE_KEY);
            if (eski === kayitliSifre) {
                var yeni = prompt("Yeni şifrenizi girin:");
                if (yeni && yeni.trim() !== "") {
                    localStorage.setItem(SIFRE_KEY, yeni.trim());
                    alert("Şifreniz değiştirildi!");
                } else {
                    alert("Geçersiz şifre.");
                }
            } else {
                alert("Eski şifre hatalı!");
            }
        }
