<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkalp Teknoloji - Ön Muhasebe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-800 text-white p-4 shadow-lg sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Türkalp Teknoloji</h1>
            <span class="text-xs bg-blue-900 px-2 py-1 rounded">Ön Muhasebe</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- Cari Ekleme Formu -->
        <section class="bg-white p-4 rounded-lg shadow-md">
            <h2 class="text-lg font-semibold text-gray-700 mb-3 border-b pb-2">Yeni Cari / Müşteri Ekle</h2>
            <form id="cariForm" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-600">Ad Soyad / Firma Adı</label>
                    <input type="text" id="unvan" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Telefon</label>
                        <input type="tel" id="telefon" class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Bakiye (TL)</label>
                        <input type="number" step="0.01" id="bakiye" placeholder="0.00" class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition duration-200">
                    Cari Kaydet
                </button>
            </form>
        </section>

        <!-- Cari Liste -->
        <section class="bg-white p-4 rounded-lg shadow-md">
            <div class="flex justify-between items-center mb-3 border-b pb-2">
                <h2 class="text-lg font-semibold text-gray-700">Cari Listesi</h2>
                <span id="toplamCari" class="text-sm font-medium text-gray-500">Toplam: 0</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm">
                            <th class="p-2 border-b">Ünvan / Ad</th>
                            <th class="p-2 border-b">Telefon</th>
                            <th class="p-2 border-b">Bakiye</th>
                            <th class="p-2 border-b text-center">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="cariListesi" class="divide-y text-sm">
                        <!-- Veriler JS ile dinamik eklenecek -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        // LocalStorage Anahtarı
        const STORAGE_KEY = 'turkalp_cari_listesi';

        // Sayfa Yüklendiğinde Verileri Al ve Listele
        document.addEventListener('DOMContentLoaded', carileriYukle);

        const cariForm = document.getElementById('cariForm');

        // Yeni Cari Ekleme
        cariForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const unvan = document.getElementById('unvan').value.trim();
            const telefon = document.getElementById('telefon').value.trim();
            const bakiye = parseFloat(document.getElementById('bakiye').value) || 0;

            if (!unvan) return;

            const yeniCari = {
                id: Date.now(),
                unvan: unvan,
                telefon: telefon,
                bakiye: bakiye
            };

            const cariler = carileriGetir();
            cariler.push(yeniCari);
            carileriKaydet(cariler);

            cariForm.reset();
            carileriYukle();
        });

        // LocalStorage'dan Verileri Oku
        function carileriGetir() {
            const veriler = localStorage.getItem(STORAGE_KEY);
            return veriler ? JSON.parse(veriler) : [];
        }

        // LocalStorage'a Verileri Kaydet
        function carileriKaydet(cariler) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cariler));
        }

        // Cari Silme İşlemi
        function cariSil(id) {
            if (confirm('Bu cariyi silmek istediğinize emin misiniz?')) {
                let cariler = carileriGetir();
                cariler = cariler.filter(c => c.id !== id);
                carileriKaydet(cariler);
                carileriYukle();
            }
        }

        // Ekrana Verileri Yazdırma
        function carileriYukle() {
            const cariler = carileriGetir();
            const listeEl = document.getElementById('cariListesi');
            const toplamEl = document.getElementById('toplamCari');

            toplamEl.textContent = `Toplam: ${cariler.length}`;
            listeEl.innerHTML = '';

            if (cariler.length === 0) {
                listeEl.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-400">Henüz kayıtlı cari bulunmuyor.</td></tr>`;
                return;
            }

            cariler.forEach(cari => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="p-2 font-medium text-gray-800">${cari.unvan}</td>
                    <td class="p-2 text-gray-600">${cari.telefon || '-'}</td>
                    <td class="p-2 font-semibold ${cari.bakiye >= 0 ? 'text-green-600' : 'text-red-600'}">
                        ${cari.bakiye.toFixed(2)} TL
                    </td>
                    <td class="p-2 text-center">
                        <button onclick="cariSil(${cari.id})" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-xs transition">
                            Sil
                        </button>
                    </td>
                `;
                listeEl.appendChild(tr);
            });
        }
    </script>
</body>
</html>
